
name: multi-env-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        type: choice
        options:
          - dev
          - staging
          - prod
        required: True
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Print workflow inputs
        run: |
          echo "Environment: ${{ inputs.environment }}"

